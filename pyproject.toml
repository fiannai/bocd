[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bocd"
version = "0.1.0"
description = "Bayesian Online Change Point Detection — streaming and batch detection of regime changes in time series."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Scott", email = "scott@fiannai.com" },
]
keywords = ["changepoint", "bayesian", "online", "detection", "time-series"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.0",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1",
    "myst-nb>=1.0",
    "sphinx-copybutton>=0.5",
]

[project.urls]
Documentation = "https://bocd.readthedocs.io"
Repository = "https://github.com/fiannai/bocd"
Issues = "https://github.com/fiannai/bocd/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bocd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.special", "scipy.stats", "scipy.*"]
ignore_missing_imports = true
